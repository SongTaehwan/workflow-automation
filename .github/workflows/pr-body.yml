name: PR body check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 필수 섹션 작성 확인
        env:
          # 셸 인젝션 방지: ${{ }} 를 run 안에 직접 넣지 말 것
          BODY: ${{ github.event.pull_request.body }}
        run: |
          perl -e '
            my $body = $ENV{BODY} // "";
            $body =~ s/\r//g;                 # GitHub 본문은 CRLF
            $body =~ s/<!--.*?-->//gs;        # 안내 주석은 작성한 내용으로 치지 않는다
            my $failed = 0;
            for my $h ("요약", "작업 지시", "검증", "화면", "리뷰 포인트") {
              if ($body !~ /^##[ \t]+\Q$h\E[ \t]*$/m) {
                print "::error::\"## $h\" 섹션이 없습니다. .github/pull_request_template.md 구조를 그대로 쓰세요.\n";
                $failed = 1;
              } elsif ($body !~ /^##[ \t]+\Q$h\E[ \t]*\n(.*?)(?=^##[ \t]|\z)/ms or $1 !~ /\S/) {
                print "::error::\"## $h\" 섹션이 비었습니다. 해당 없으면 \"없음\" 이라고 적으세요.\n";
                $failed = 1;
              }
            }
            exit $failed;
          '
