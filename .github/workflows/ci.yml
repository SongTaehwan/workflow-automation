name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 버전은 저장소 파일이 단일 소스 — pnpm 은 package.json 의 packageManager,
      # node 는 .nvmrc 에서 읽는다. 여기에 숫자를 다시 적지 말 것.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build # tsc -b 를 포함하므로 typecheck 는 따로 돌리지 않는다
